<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>採購訂單追蹤儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f4;--fg:#1c2a2e;--mut:#65737a;--card:#fff;--line:#d8ddda;--ac:#0e6a6d;--ac2:#d9ecec;--warn:#a96a10;--bad:#b0402c;--ok:#2f7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181a;--fg:#e4ecec;--mut:#8fa0a5;--card:#192225;--line:#2b383c;--ac:#4cc0c3;--ac2:#1d3a3c;--warn:#e0a24a;--bad:#e5806c;--ok:#6cc58c}}
:root[data-theme="dark"]{--bg:#11181a;--fg:#e4ecec;--mut:#8fa0a5;--card:#192225;--line:#2b383c;--ac:#4cc0c3;--ac2:#1d3a3c;--warn:#e0a24a;--bad:#e5806c;--ok:#6cc58c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}
button.g{background:transparent;color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.k b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.k span{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}
.m{height:8px;background:var(--ac);border-radius:4px;min-width:2px}
td.it{max-width:200px;overflow:hidden;text-overflow:ellipsis}
td input{width:104px;padding:3px 5px}td input.s{width:64px}td input.need{background:color-mix(in srgb,var(--ok) 30%,var(--card));border-color:var(--ok)}
td input[type=checkbox]{width:auto;padding:0;transform:scale(1.25)}
#diff .card{margin-bottom:16px;border-color:var(--ac)}
#diff table{margin:6px 0 12px}#diff td{white-space:normal}
#diff .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
a.trkbtn,span.trkbtn{display:inline-block;margin-left:4px;padding:3px 8px;border:1px solid var(--ac);border-radius:6px;color:var(--ac);text-decoration:none;font-size:12px}
span.trkbtn.off{opacity:.35}
td input:disabled{opacity:.35}
.st{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.st.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}.st.o{color:var(--ok);background:transparent;border:1px solid var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}

.trk th:nth-child(-n+6),.trk td:nth-child(-n+6){position:sticky;background:var(--card);z-index:1;overflow:hidden;text-overflow:ellipsis}
.trk th:nth-child(-n+6){z-index:3}
.trk th:nth-child(1),.trk td:nth-child(1){left:0;width:132px;min-width:132px;max-width:132px}
.trk th:nth-child(2),.trk td:nth-child(2){left:132px;width:80px;min-width:80px;max-width:80px}
.trk th:nth-child(3),.trk td:nth-child(3){left:212px;width:100px;min-width:100px;max-width:100px}
.trk th:nth-child(4),.trk td:nth-child(4){left:312px;width:180px;min-width:180px;max-width:180px}
.trk th:nth-child(5),.trk td:nth-child(5){left:492px;width:84px;min-width:84px;max-width:84px}
.trk th:nth-child(6),.trk td:nth-child(6){left:576px;width:170px;min-width:170px;max-width:170px;box-shadow:2px 0 0 var(--line)}
@media(max-width:900px){.trk th:nth-child(n+2),.trk td:nth-child(n+2){position:static;left:auto;box-shadow:none}.trk th:nth-child(n+2){position:sticky;left:auto}.trk th:nth-child(1),.trk td:nth-child(1){box-shadow:2px 0 0 var(--line)}}
.pdel.warn{background:var(--bad);border-color:var(--bad);color:#fff;white-space:nowrap}
</style></head><body><main>
<h1>採購訂單追蹤儀表板</h1>
<p class="sub">金額單位：萬元（台幣）。台幣金額＝PO單價 × 匯率 × (1＋關稅%) × 主檔採購數量 ÷ 10,000。關稅欄呈綠底，表示尚無預設值，需要填入。</p>
<div class="bar">
<label>上傳訂單明細（.xls / .xlsx）或先前匯出的填寫檔<input type="file" id="f" accept=".xls,.xlsx" multiple></label>
<label>會計年度（7月～隔年6月）<select id="fy"></select></label>
<label>訂單來源<select id="src"></select></label>
<label>到港年月<select id="am"></select></label>
<label>品項（小類）<select id="it"></select></label>
<label>搜尋<input id="q" type="search" placeholder="PO、供應商、品項、B/L…"></label>
<button id="ex" class="g">匯出填寫資料</button>
<button id="bk" class="g" title="把訂單明細與填寫資料一次存成一個檔案">完整備份</button>
<button id="rb" class="g" title="從備份檔還原訂單明細與填寫資料">還原備份</button>
<input type="file" id="rs" accept=".json,application/json" hidden>
<span id="sv" class="sub" style="margin:0;align-self:center"></span>
</div>
<datalist id="crs"><option>長榮海運</option><option>陽明海運</option><option>萬海航運</option><option>Maersk</option><option>MSC</option><option>Hapag-Lloyd</option><option>CMA CGM</option><option>ONE</option><option>COSCO</option><option>HMM</option><option>ZIM</option><option>OOCL</option><option>WiseGrid</option></datalist>
<div id="diff"></div>
<div id="out"><div class="empty">請先上傳訂單明細檔。上傳後資料會保留在頁面上，下次開啟不需重新上傳；再上傳新檔時，會先和現有資料比對，確認後才更新。</div></div>
<div id="plan"></div>
<datalist id="its"></datalist><datalist id="sups"></datalist>
</main>
<script>
const SRC={D:'國內採購',C:'中國採購',S:'貿易單',F:'進口採購',N:'兩廠代工'};
const LS='proc_fill_v1';let fill={},pos=[];
try{fill=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(fill))}catch(e){}};
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ym=d=>d?d.getFullYear()+'/'+p2(d.getMonth()+1):'—';
const ymd=d=>d?ym(d)+'/'+p2(d.getDate()):'—';
const fyOf=d=>d.getMonth()>=6?d.getFullYear()+1:d.getFullYear();
const num=(x,d=1)=>x.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const fx=(o,k)=>(fill[o.po]||{})[k]||'';
const dt=v=>v instanceof Date?new Date(v.getTime()+60000):null;
function readWb(buf){const wb=XLSX.read(buf,{type:'array',cellDates:true});
 return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null});}
function ingest(rows){
 if(!rows.length)return;
 if('PO號碼' in rows[0]){rows.forEach(r=>{if(!r['PO號碼'])return;const o=fill[r['PO號碼']]=fill[r['PO號碼']]||{};
  [['pi','PI單號'],['inv','INV號碼'],['bl','B/L號碼'],['cr','船公司'],['h','H號'],['sps','SPS'],['t','關稅%'],['c','報關日'],['r','放行日'],['u','拆櫃日'],['s','入庫日']].forEach(([k,h])=>{if(r[h]!=null&&r[h]!=='')o[k]=k==='sps'?(/^(v|1|是|true)$/i.test(String(r[h]).trim())?'1':''):String(r[h])})});save();Object.keys(fill).forEach(k=>dirty.add(k));flush();return}
 if(!('採購單號' in rows[0]))return;
 const m={};
 rows.forEach(r=>{const po=String(r['採購單號']||'').trim();if(!/^[A-Za-z]\d/.test(po))return;
  const o=m[po]=m[po]||{po,base:0,sup:r['供應商']||'',it:{},og:{},fc:0,cd:null,ad:null,n:0};
  if(r['小類']){const k=String(r['小類']).trim(),q=+r['主檔採購數量']||0,or=String(r['產地']||'').trim(),g=(o.og[k]=o.og[k]||{});o.it[k]=(o.it[k]||0)+q;g[or]=(g[or]||0)+q}
  o.fc+=(+r['PO單價']||0)*(+r['主檔採購數量']||0);o.base+=(+r['PO單價']||0)*(+r['匯率轉換日']||1)*(+r['主檔採購數量']||0);o.n++;
  const c=dt(r['PO建立日']),a=dt(r['到港日']);
  if(c&&(!o.cd||c<o.cd))o.cd=c;if(a&&(!o.ad||a>o.ad))o.ad=a});
 return Object.values(m);
}
const topIt=o=>Object.entries(o.it).sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||'';
const allIt=o=>Object.entries(o.it).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+'('+num(x[1],0)+')').join('、');
const rt=o=>o.fc?o.base/o.fc:1;
const DT={D:0,N:0,S:0,C:9};
const CARRIERS=[
 ['長榮|evergreen|emc','長榮海運 ShipmentLink','https://www.shipmentlink.com/servlet/TDB1_CargoTracking.do'],
 ['陽明|yang ming|yangming|yml','陽明海運','https://www.yangming.com/e-service/track_trace/track_trace_cargo_tracking.aspx'],
 ['萬海|wan hai|wanhai|whl','萬海航運','https://www.wanhai.com/views/cargoTrack/CargoTrack.xhtml'],
 ['maersk|馬士基','Maersk','https://www.maersk.com/tracking/{bl}'],
 ['msc|地中海','MSC','https://www.msc.com/en/track-a-shipment'],
 ['hapag|赫伯羅特','Hapag-Lloyd','https://www.hapag-lloyd.com/en/online-business/track/track-by-booking-solution.html'],
 ['cma|達飛','CMA CGM','https://www.cma-cgm.com/ebusiness/tracking'],
 ['one|ocean network','ONE','https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking'],
 ['cosco|中遠','中遠海運 COSCO','https://elines.coscoshipping.com/ebusiness/cargoTracking'],
 ['hmm|現代商船','HMM','https://www.hmm21.com/e-service/general/trackNTrace/TrackNTrace.do'],
 ['zim|以星','ZIM','https://www.zim.com/tools/track-a-shipment'],
 ['oocl|東方海外','OOCL','https://www.oocl.com/eng/ourservices/eservices/cargotracking/'],
 ['wisegrid','WiseGrid 平台（需登入）','https://www-ad8prd.wisegrid.net/Portals/NEO/Desktop#/login/index']];
const CR_DEF={F2600294:'WiseGrid'};
const crOf=o=>fx(o,'cr')||CR_DEF[o.po]||'';
function trkFind(cr){const c=String(cr||'').trim().toLowerCase();if(!c)return null;return CARRIERS.find(x=>x[0].split('|').some(k=>c.includes(k)))||null}
function trkUrl(cr,bl){const f=trkFind(cr);return f?f[2].replace('{bl}',encodeURIComponent(bl)):'https://www.searates.com/container/tracking/?number='+encodeURIComponent(bl)}
function trkName(cr){const f=trkFind(cr);return f?'前往'+f[1]+'查詢':'未指定船公司，前往 SeaRates 通用查詢'}
const PLK='proc_plan_v1',PLL='proc_planlog_v1';let plan=[],plog=[],ptm=null,pfm='',showLog=false,parm=null,pta=null;
try{plan=JSON.parse(localStorage.getItem(PLK)||'[]')||[]}catch(x){plan=[]}
try{plog=JSON.parse(localStorage.getItem(PLL)||'[]')||[]}catch(x){plog=[]}
const PSTAT=['等PI','議價中','申請料號'],PTYPE=['F','D','N','S','C'];
function planSave(){try{localStorage.setItem(PLK,JSON.stringify(plan));localStorage.setItem(PLL,JSON.stringify(plog))}catch(x){}
 clearTimeout(ptm);ptm=setTimeout(async()=>{if(!DB)return;try{await DB.collection('plan').doc('list').set({rows:plan});await DB.collection('plan').doc('log').set({rows:plog})}catch(x){fail=true;stat()}},600)}
const ptar=r=>{if(r.tariff!==''&&r.tariff!=null)return String(r.tariff);if(r.type==='F')return r.item?fDef({po:'F',it:{[r.item]:1},og:{}}):'';const d=DT[r.type];return d==null?'':String(d)};
const pfx=r=>r.fx!==''&&r.fx!=null?String(r.fx):(r.type==='D'||r.type==='N'?'1':'');
const pmon=r=>r.eta?String(r.eta).slice(0,7):'';
const pfmt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false});
function pamt(r){const a=parseFloat(r.price),f=parseFloat(pfx(r)),q=parseFloat(r.qty),t=parseFloat(ptar(r))||0,c=parseFloat(r.cont),cc=isNaN(c)?1:c;
 return(isNaN(a)||isNaN(f)||isNaN(q))?null:a*f*(1+t/100)*q*cc/10000}
function prow(r){const T=ptar(r),a=pamt(r);
 const inp=(f,t,c,ex)=>`<input ${c||''} type="${t}" ${ex||''} value="${e(r[f]??'')}" data-pid="${r.id}" data-f="${f}">`;
 const sel=(f,l)=>`<select data-pid="${r.id}" data-f="${f}"><option value=""></option>${l.map(x=>`<option${r[f]===x?' selected':''}>${x}</option>`).join('')}</select>`;
 return `<tr><td>${inp('item','text','list="its" style="width:210px"')}</td><td>${sel('type',PTYPE)}</td><td>${inp('sup','text','list="sups" style="width:170px"')}</td>
 <td>${inp('price','number','class="s" style="width:84px"','step="any"')}</td><td>${inp('fx','number','class="s" style="width:76px"','step="any" placeholder="'+e(pfx(r))+'"')}</td>
 <td><input class="s${T===''&&r.type?' need':''}" type="number" step="0.1" value="${e(T)}" data-pid="${r.id}" data-f="tariff"></td>
 <td>${inp('dest','text','style="width:120px"')}</td><td>${inp('cont','number','class="s"','step="any"')}</td><td>${inp('qty','number','style="width:96px"','step="any"')}</td>
 <td>${inp('etd','date')}</td><td>${inp('eta','date')}</td><td>${sel('status',PSTAT)}</td><td class="n">${a==null?'—':num(a)}</td><td>${inp('note','text','style="width:240px"')}</td>
 <td><button class="g pdel${parm===r.id?' warn':''}" data-pid="${r.id}" title="刪除這一筆（會留下刪除紀錄）">${parm===r.id?'確定刪除？':'✕'}</button></td></tr>`}
function renderPlan(){
 const months=[...new Set(plan.map(pmon).filter(Boolean))].sort(),hasNone=plan.some(r=>!pmon(r));
 if(pfm&&pfm!=='__none'&&!months.includes(pfm))pfm='';
 if(pfm==='__none'&&!hasNone)pfm='';
 const L=plan.filter(r=>!pfm||(pfm==='__none'?!pmon(r):pmon(r)===pfm));
 const tot=L.reduce((t,r)=>t+(pamt(r)||0),0),cn=L.reduce((t,r)=>t+(parseFloat(r.cont)||0),0),sc=PSTAT.map(x=>x+' '+L.filter(r=>r.status===x).length).join('｜');
 const g={};plan.forEach(r=>{const k=pmon(r)||'__none';(g[k]=g[k]||{n:0,c:0,a:0});g[k].n++;g[k].c+=parseFloat(r.cont)||0;g[k].a+=pamt(r)||0});
 const gk=Object.keys(g).sort((a,b)=>a==='__none'?1:b==='__none'?-1:a.localeCompare(b)),lab=k=>k==='__none'?'未填到港日':k.replace('-','/');
 const sum=gk.length?`<h2 style="margin-top:14px">各月預估到貨（點月份可篩選）</h2><div class="sc"><table><tr><th>預計到港年月</th><th class="n">筆數</th><th class="n">櫃數</th><th class="n">預估金額(萬)</th></tr>${gk.map(k=>`<tr><td><button class="g pm" data-m="${k}">${lab(k)}</button></td><td class="n">${g[k].n}</td><td class="n">${num(g[k].c,0)}</td><td class="n">${num(g[k].a)}</td></tr>`).join('')}</table></div>`:'';
 const lg=showLog?`<h2 style="margin-top:14px">刪除紀錄（${plog.length} 筆）</h2><p class="sub" style="margin:0 0 6px">刪除的資料會留在這裡，可以還原。紀錄存放在瀏覽器的本機儲存空間（線上版另存雲端），沒有檔案路徑；要留存檔案請按「匯出刪除紀錄」，或使用「完整備份」。</p>
 ${plog.length?`<div class="sc" style="max-height:300px"><table><tr><th>刪除時間</th><th>品項</th><th>性質</th><th>供應商</th><th class="n">單價</th><th class="n">櫃數</th><th class="n">貨量(每櫃)</th><th>預計到港日</th><th>狀態</th><th class="n">預估金額(萬)</th><th>註解</th><th></th></tr>${plog.slice().reverse().map(x=>{const r=x.row,a=pamt(r);return `<tr><td>${pfmt(x.t)}</td><td>${e(r.item)}</td><td>${e(r.type)}</td><td>${e(r.sup)}</td><td class="n">${e(r.price)}</td><td class="n">${e(r.cont)}</td><td class="n">${e(r.qty)}</td><td>${e(r.eta)}</td><td>${e(r.status)}</td><td class="n">${a==null?'—':num(a)}</td><td>${e(r.note)}</td><td><button class="g prs" data-t="${x.t}">還原</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">目前沒有刪除紀錄</div>'}`:'';
 $('#plan').innerHTML=`<div class="card" style="margin-top:16px"><h2>預計採購列表</h2>
 <p class="sub" style="margin:0 0 8px">預估採購金額，預估金額(萬) ＝ 單價 × 匯率 × (1＋關稅%) × 貨量 × 櫃數 ÷ 10,000，貨量（每櫃）單位請與單價一致（例如都用公斤）。D、N 單匯率未填時以 1 計算，櫃數未填時以 1 計算；關稅欄綠底表示尚無預設值，需要填入。</p>
 <div class="bar" style="margin-bottom:8px"><label>預計到港年月<select id="pfm"><option value="">全部</option>${months.map(m=>`<option value="${m}"${pfm===m?' selected':''}>${m.replace('-','/')}</option>`).join('')}${hasNone?`<option value="__none"${pfm==='__none'?' selected':''}>未填到港日</option>`:''}</select></label></div>
